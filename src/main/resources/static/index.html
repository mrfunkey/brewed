<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Second Listen | Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
    <script src="js/welcome.js" defer></script>
    <script src="js/navbar.js" defer></script>
    <script src="js/posts.js" defer></script>
</head>
<body>
    <div>
        <div id="nav-bar" class="nav-bar"></div>
        <div>
            <div class="post-heading">
                <h1 class="heading">welcome in, <span class="name"></span> </h1>
            </div>
            <div class="home-feed">
                <div>
                    <h2 class="heading">
                        top brews this week
                    </h2>
                    <h3 class="subheading">
                        intake of the most liked brews.
                    </h3>
                    <div class="post-list">
                        <div id="most-liked-by-week" class="post-list">
                        </div>
                    </div>
                </div>
                <div>
                    <h2 class="heading">
                        notifications
                    </h2>
                    <h3 class="subheading">
                        likes, comments, and more.
                    </h3>
                    <div class="post-list">
                        <div class="post-list">
                        </div>
                    </div>
                </div>
                <div>
                    <h2 class="heading">
                        freshly brewed
                    </h2>
                    <h3 class="subheading">
                        collection of recent brews.
                    </h3>
                    <div class="post-list">
                        <div id="recent-posts" class="post-list">
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
