<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Second Listen | Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <script src="js/signup.js" defer></script>
</head>
<body>
  <div>
    <span class="logo">Second Listen</span>
  </div>
  <div>
    <div class="create-post">
      <h3>Alias:</h3>
      <input type="text" id="alias" class="text-box" placeholder="Your alias here..." required>
      <h3>Email:</h3>
      <input type="text" id="email" class="text-box" placeholder="Your email here..." required>
      <h3>Password:</h3>
      <input type="password" id="password" class="text-box" placeholder="Your password here..." required>
      <h3>Confirm Password:</h3>
      <input type="password" id="confirm-password" class="text-box" placeholder="Your password here..." required>
    </div>
    <button class="accountbutton" id="signup">Sign Up</button>
  </div>
</body>
</html>
