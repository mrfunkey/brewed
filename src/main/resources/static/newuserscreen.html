<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Second Listen | Account</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
  <script src="js/account.js" defer></script>
</head>
<body>
  <div>
    <div class="logo-signup">
      <span class="logo" id="logo-large">brewed</span>
    </div>
    <div class="create-post">
      <h3>alias:</h3>
      <input type="text" id="alias" class="text-box" required>
      <h3>email:</h3>
      <input type="text" id="email" class="text-box" required>
      <h3>password:</h3>
      <input type="password" id="password" class="text-box" required>
      <h3>confirm password:</h3>
      <input type="password" id="confirm-password" class="text-box" required>
    </div>
    <div class="account-buttons-container">
      <a href="index.html" class="nav-button" id="signup">sign up</a>
      <div>
        <a id="login" style="font-size: 16px;">have an account already?</a>
      </div>
      <a class="login-link" href="login.html" style="margin-top:4px;"> log in </a>
    </div>

  </div>
</body>
</html>
